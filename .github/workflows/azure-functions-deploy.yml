# Azure Functions へのビルドとデプロイ

name: Deploy to Azure Functions

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: false

permissions: {}

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC 認証に必要
      contents: read

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: 📦 Publish
        run: dotnet publish --configuration Release --output ./output

      - name: 🔑 Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔍 Bicep what-if
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          STEAM_PROFILE_ID: ${{ secrets.STEAM_PROFILE_ID }}
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: 🚀 Deploy Bicep infrastructure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          STEAM_PROFILE_ID: ${{ secrets.STEAM_PROFILE_ID }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: 🚀 Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          scm-do-build-during-deployment: false
